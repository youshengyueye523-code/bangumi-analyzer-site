---
# 发布：只把「正式产物子集」上传到 GitHub Pages。
# 与 scripts/deploy-check.mjs 校验的清单一致 —— 开发工具（serve.mjs / scripts/*.mjs /
# README.md / start-site.bat）不会出现在公开站点里。
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble production subset
        run: |
          mkdir -p _site/scripts
          cp index.html _site/
          cp -r styles assets _site/
          cp scripts/app.js _site/scripts/
          cp -r scripts/content _site/scripts/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact indexing
        run: sleep 10
      - id: deployment
        uses: actions/deploy-pages@v4
